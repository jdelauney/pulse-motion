<!-- Scène « reserve » (style chaleureux, composée) : une grande cuve qui se remplit par vagues jusqu'à 15 000 litres, comme une jauge. Durée : 12 s.
     Textes : titre, sous. Quatre gouttes tombent (3t, 6t, 9t, 12t), chacune soulève l'eau d'un cran ; un repère de la jauge s'allume à chaque cran.
     Tempo 120 : 1t = 0,5 s. Fin des entrées à 8,3 s, la houle et les galets bougent jusqu'au bout. -->
<section data-scene="reserve">
  <style>
    @scope {
      .reserve { display: grid; grid-template-columns: auto 1fr; gap: 9cqh; align-items: center; }
      .zone { position: relative; width: 58cqh; height: 62cqh; }
      .cuve {
        position: absolute; left: 0; top: 0; width: 46cqh; height: 62cqh; box-sizing: border-box; overflow: hidden;
        border: 0.9cqh solid var(--c-primaire-lisible); border-top-width: 0.5cqh;
        border-radius: 3cqh 3cqh 8cqh 8cqh;
        background: color-mix(in srgb, var(--c-primaire) 6%, var(--c-fond));
      }
      .eau {
        position: absolute; left: 0; right: 0; bottom: 0; height: 0;
        background: color-mix(in srgb, var(--c-primaire) 58%, var(--c-fond));
        animation: re-remplit 6s linear both;
      }
      /* Quatre vagues : chacune monte en 0,9 s avec un léger débord (back-out), puis l'eau se pose 0,6 s. */
      @keyframes re-remplit {
        0%   { height: 0%; opacity: 0; animation-timing-function: var(--ease-back-out); }
        3%   { opacity: 1; }
        15%  { height: 22%; opacity: 1; }
        25%  { height: 22%; animation-timing-function: var(--ease-back-out); }
        40%  { height: 44%; }
        50%  { height: 44%; animation-timing-function: var(--ease-back-out); }
        65%  { height: 66%; }
        75%  { height: 66%; animation-timing-function: var(--ease-back-out); }
        90%  { height: 88%; }
        100% { height: 88%; opacity: 1; }
      }
      /* Houle : deux bandes ondulées posées sur l'eau, qui glissent en sens contraire pendant toute la scène. */
      .houle { position: absolute; left: 0; bottom: calc(100% - 0.2cqh); width: 300%; height: 4cqh; display: block; }
      .houle path { fill: color-mix(in srgb, var(--c-primaire) 58%, var(--c-fond)); }
      .houle.avant { transform: translateX(calc(var(--p, 0) * -50%)); }
      .houle.arriere { height: 5.2cqh; opacity: 0.45; transform: translateX(calc((1 - var(--p, 0)) * -50%)); }
      .goutte {
        position: absolute; left: 21cqh; top: -10cqh; width: 4cqh; height: 4cqh;
        border-radius: 0 50% 50% 50%; rotate: 45deg; background: var(--c-primaire);
        animation: re-goutte 0.5s var(--ease-quad-in) both;
      }
      @keyframes re-goutte {
        0%   { opacity: 0; translate: 0 0; }
        20%  { opacity: 1; }
        85%  { opacity: 1; }
        100% { opacity: 0; translate: 0 var(--chute); }
      }
      .repere {
        position: absolute; left: 48.5cqh; width: 7cqh; height: 1.2cqh; border-radius: 99cqh;
        background: var(--c-accent-lisible); transform-origin: left center; transform: scaleX(var(--p, 0));
      }
      .repere.plein { width: 9.5cqh; height: 1.8cqh; }
      .textes { display: flex; flex-direction: column; gap: 3cqh; min-width: 0; }
    }
  </style>
  <div class="decor">
    <span class="galet" data-decor style="width: 50cqh; height: 44cqh; right: -14cqh; bottom: -20cqh" data-start="0" data-dur="12" data-tween="--dx 0cqh→-8cqh sine-inout; --m 0→1 sine-inout"></span>
    <span class="galet sauge" data-decor style="width: 34cqh; height: 30cqh; right: 22cqh; top: -14cqh" data-start="0" data-dur="12" data-tween="--dy 0cqh→6cqh sine-inout; --m 0→1 sine-inout"></span>
  </div>
  <div class="reserve">
    <div class="zone" data-decor>
      <div id="cuve" class="cuve eclot" data-decor data-start="0.4" data-dur="0.8">
        <div id="eau" class="eau" data-decor data-start="4t" data-dur="12t">
          <svg class="houle arriere" data-decor aria-hidden="true" viewBox="0 0 300 10" preserveAspectRatio="none" data-start="0" data-dur="12"><path d="M0 5 Q6.25 1 12.5 5 T25 5 T37.5 5 T50 5 T62.5 5 T75 5 T87.5 5 T100 5 T112.5 5 T125 5 T137.5 5 T150 5 T162.5 5 T175 5 T187.5 5 T200 5 T212.5 5 T225 5 T237.5 5 T250 5 T262.5 5 T275 5 T287.5 5 T300 5 L300 10 L0 10 Z"/></svg>
          <svg class="houle avant" data-decor aria-hidden="true" viewBox="0 0 300 10" preserveAspectRatio="none" data-start="0" data-dur="12"><path d="M0 5 Q6.25 1 12.5 5 T25 5 T37.5 5 T50 5 T62.5 5 T75 5 T87.5 5 T100 5 T112.5 5 T125 5 T137.5 5 T150 5 T162.5 5 T175 5 T187.5 5 T200 5 T212.5 5 T225 5 T237.5 5 T250 5 T262.5 5 T275 5 T287.5 5 T300 5 L300 10 L0 10 Z"/></svg>
        </div>
      </div>
      <span id="goutte1" class="goutte" data-decor style="--chute: 66cqh" data-start="3t" data-dur="0.5" data-son="pop"></span>
      <span id="goutte2" class="goutte" data-decor style="--chute: 54cqh" data-start="6t" data-dur="0.5"></span>
      <span id="goutte3" class="goutte" data-decor style="--chute: 41cqh" data-start="9t" data-dur="0.5"></span>
      <span id="goutte4" class="goutte" data-decor style="--chute: 28cqh" data-start="12t" data-dur="0.5"></span>
      <span id="repere1" class="repere" data-decor style="bottom: calc(0.9cqh + 13.2cqh - 0.6cqh)" data-start="#eau+0.8" data-dur="0.5"></span>
      <span id="repere2" class="repere" data-decor style="bottom: calc(0.9cqh + 26.4cqh - 0.6cqh)" data-start="#eau+2.3" data-dur="0.5"></span>
      <span id="repere3" class="repere" data-decor style="bottom: calc(0.9cqh + 39.6cqh - 0.6cqh)" data-start="#eau+3.8" data-dur="0.5"></span>
      <span id="repere4" class="repere plein" data-decor style="bottom: calc(0.9cqh + 52.8cqh - 0.9cqh)" data-start="#eau+5.3" data-dur="0.6" data-son="ding"></span>
    </div>
    <div class="textes">
      <h2 id="titre" class="titre pose" data-texte="titre" data-start="2t" data-dur="0.9"></h2>
      <p id="sous" class="sous-titre pose" data-texte="sous" data-start="#titre:fin+0.3" data-dur="0.9"></p>
    </div>
  </div>
</section>
