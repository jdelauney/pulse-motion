<!-- Scène « recap » (style chaleureux, scène toute faite « liste », 3 points) : les trois réflexes à retenir. Durée : 15 s. -->
<section data-scene="recap">
  <div class="decor">
    <span class="galet sauge" data-decor style="width: 52cqh; height: 46cqh; right: -16cqh; top: -14cqh" data-start="0" data-dur="15" data-tween="--dy 0cqh→8cqh sine-inout; --m 0→1 sine-inout"></span>
  </div>
  <h2 id="titre" class="titre-moyen pose" data-texte="titre" data-start="0.2" data-dur="0.9"></h2>
  <ul class="cartes">
    <li id="point1" class="pose" data-texte="point1" data-start="#titre:fin+0.3" data-dur="0.9" data-son="pop"></li>
    <li id="point2" class="pose" data-texte="point2" data-start="#point1:fin+0.9" data-dur="0.9" data-son="pop"></li>
    <li id="point3" class="pose" data-texte="point3" data-start="#point2:fin+0.9" data-dur="0.9" data-son="pop"></li>
  </ul>
</section>
