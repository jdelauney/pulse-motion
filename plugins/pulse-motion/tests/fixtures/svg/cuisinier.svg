<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Personnage d'essai pour la découpe (tests) : groupes transformés, classes et <style>, un dégradé, des formes sans id, un calque nommé. De profil, tourné vers la droite. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 400 700" width="400" height="700">
  <style>
    .peau { fill: #F2C9A0; }
    .tenue { fill: #FFFFFF; stroke: #2A2633; stroke-width: 3; }
    .sombre { fill: #3A2A22; }
  </style>
  <defs>
    <linearGradient id="degrade-toque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFAFA"/>
      <stop offset="1" stop-color="#D0D0D0"/>
    </linearGradient>
  </defs>
  <ellipse id="ombre" cx="210" cy="618" rx="70" ry="8" fill="#000000" opacity="0.2"/>
  <g id="jambe-arriere" inkscape:label="Jambe arrière" transform="translate(-10 0)">
    <rect id="cuisse-ar" x="202" y="395" width="16" height="112" rx="8" class="tenue"/>
    <rect id="tibia-ar" x="202" y="495" width="16" height="112" rx="8" class="tenue"/>
    <path id="chaussure-ar" d="M 202 598 L 252 600 Q 258 608 250 614 L 202 614 Z" class="sombre"/>
  </g>
  <rect id="veste" x="182" y="272" width="40" height="140" rx="14" class="tenue"/>
  <g id="jambe-avant" inkscape:label="Jambe avant" transform="translate(5 0)">
    <rect id="cuisse-av" x="187" y="395" width="18" height="112" rx="9" class="tenue"/>
    <rect x="188" y="495" width="16" height="112" rx="8" class="tenue"/>
    <path id="chaussure-av" d="M 188 598 L 240 600 Q 246 608 238 614 L 188 614 Z" class="sombre"/>
  </g>
  <g id="tete" inkscape:label="Tête">
    <ellipse id="visage" cx="205" cy="210" rx="45" ry="55" class="peau"/>
    <path id="toque" d="M 165 168 Q 160 110 205 105 Q 250 110 245 168 Z" fill="url(#degrade-toque)" stroke="#2A2633" stroke-width="3"/>
    <circle id="oeil-blanc" cx="228" cy="200" r="9" fill="#FFFFFF" stroke="#2A2633" stroke-width="2"/>
    <circle id="pupille" cx="230" cy="200" r="4" fill="#2A2633"/>
    <path id="bouche" d="M 224 236 Q 234 242 243 234" fill="none" stroke="#2A2633" stroke-width="3"/>
  </g>
  <g id="bras-avant" transform="rotate(10 205 295)">
    <rect id="bras-av" x="198" y="290" width="14" height="80" rx="7" class="tenue"/>
    <rect id="avant-bras-av" x="198" y="362" width="14" height="74" rx="7" class="tenue"/>
    <circle id="main-av" cx="205" cy="446" r="10" class="peau"/>
  </g>
</svg>
