<!-- Scène toute faite « liste » (style recit-donnees) : un point, un fait ; chaque fait arrive avec son point sur l'axe. Durée conseillée : 12 s.
     Textes : titre (≤ 32 car.), point1 … point4 (≤ 36 car.). Moins de 4 points : supprimer les points en trop. -->
<section data-scene="liste">
  <div class="decor">
    <span class="ombre-crayon" data-decor data-start="0" data-dur="12"></span>
    <span class="crayon" data-decor data-start="0" data-dur="12"></span>
  </div>
  <h2 id="titre" class="titre-moyen arrive" data-texte="titre" data-start="0.4"></h2>
  <div class="repere">
    <span class="axe-y" data-start="0.8" data-dur="0.8"></span>
    <ul class="faits">
      <li id="point1" class="arrive" data-texte="point1" data-start="1.8"></li>
      <li id="point2" class="arrive" data-texte="point2" data-start="#point1+2.2"></li>
      <li id="point3" class="arrive" data-texte="point3" data-start="#point2+2.2"></li>
      <li id="point4" class="arrive" data-texte="point4" data-start="#point3+2.2"></li>
    </ul>
  </div>
</section>
