<!-- Scène toute faite « liste » (style plan-technique) : une nomenclature de 2 à 4 lignes à repères numérotés. Durée conseillée : 12 s.
     Textes : titre (≤ 36 car.), point1 … point4 (≤ 40 car.). Moins de 4 points : supprimer les points en trop. -->
<section data-scene="liste">
  <div class="decor">
    <span class="grille" data-decor data-start="0" data-dur="12" data-tween="--x 0cqh→-4cqh linear"></span>
    <span class="cadre" data-start="0" data-dur="1.2"></span>
  </div>
  <h2 id="titre" class="titre-moyen ecrit" data-texte="titre" data-start="0.6" data-dur="0.9"></h2>
  <ol class="nomenclature">
    <li id="point1" class="ecrit" data-texte="point1" data-start="#titre:fin+0.3" data-dur="0.9"></li>
    <li id="point2" class="ecrit" data-texte="point2" data-start="#point1:fin+0.8" data-dur="0.9"></li>
    <li id="point3" class="ecrit" data-texte="point3" data-start="#point2:fin+0.8" data-dur="0.9"></li>
    <li id="point4" class="ecrit" data-texte="point4" data-start="#point3:fin+0.8" data-dur="0.9"></li>
  </ol>
</section>
