<!-- Scène toute faite « chiffre » (style plan-technique) : une mesure ; la cote et la coupe hachurée s'étirent avec la valeur. Durée conseillée : 7 s.
     Textes : titre (≤ 36 car.), unite (≤ 3 car., vide si aucune), legende (≤ 54 car.). Valeur : remplacer 1250 dans « nombre 0→1250 ». -->
<section data-scene="chiffre">
  <div class="decor">
    <span class="grille" data-decor data-start="0" data-dur="7" data-tween="--x 0cqh→-4cqh linear"></span>
    <span class="cadre" data-start="0" data-dur="1.2"></span>
  </div>
  <h2 id="titre" class="titre-moyen ecrit" data-texte="titre" data-start="0.6" data-dur="0.9"></h2>
  <div class="mesure">
    <p class="nombre"><span id="valeur" data-start="#titre:fin+0.2" data-dur="1.6" data-tween="nombre 0→1250 cubic-inout">0</span><span class="unite" data-texte="unite"></span></p>
    <span id="cote" class="cote accent" data-start="#titre:fin+0.2" data-dur="1.6"></span>
    <span id="coupe" class="coupe" data-start="#titre:fin+0.2" data-dur="1.6"></span>
  </div>
  <p id="legende" class="texte ecrit" data-texte="legende" data-start="#valeur:fin+0.2" data-dur="0.9"></p>
</section>
