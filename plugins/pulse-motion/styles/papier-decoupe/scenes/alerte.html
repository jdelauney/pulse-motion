<!-- Scène toute faite « alerte » (style papier-decoupe) : une feuille pliée au coin, bordée d'une bande d'accent, qui se pose et se soulève. Durée conseillée : 8 s.
     Textes : titre (≤ 30 car.), texte (≤ 64 car.). -->
<section data-scene="alerte">
  <div class="decor">
    <span class="rond" data-decor data-start="0" data-dur="8" data-tween="--y 0cqh→1.4cqh sine-inout"></span>
    <span class="colline pres" data-decor data-start="0" data-dur="8" data-tween="--x 0cqh→-4cqh linear"></span>
  </div>
  <div id="boite" class="feuille cadre-alerte pli souleve pm-m-monte" data-start="0.3" data-dur="2.4">
    <h2 id="titre" class="titre-moyen compte" data-texte="titre" data-mots="monte" data-start="0.8" data-dur="0.9"></h2>
    <p id="texte" class="texte" data-texte="texte" data-mots="monte" data-start="#titre:fin+0.3" data-dur="1.2"></p>
  </div>
</section>
