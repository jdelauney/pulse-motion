<!-- Scène toute faite « liste » (style papier-decoupe) : 2 à 4 points sur une feuille, une pastille de papier devant chacun. Durée conseillée : 12 s.
     Textes : titre (≤ 30 car.), point1 … point4 (≤ 36 car.). Moins de 4 points : supprimer les points en trop. -->
<section data-scene="liste">
  <div class="decor">
    <span class="colline loin" data-decor data-start="0" data-dur="12" data-tween="--x 0cqh→-2cqh linear"></span>
    <span class="colline pres" data-decor data-start="0" data-dur="12" data-tween="--x 0cqh→-6cqh linear"></span>
  </div>
  <h2 id="titre" class="titre-moyen" data-texte="titre" data-mots="monte" data-start="0.4" data-dur="0.9"></h2>
  <ul class="points feuille pm-m-monte" data-start="#titre:fin+0.2">
    <li id="point1" class="pm-m-monte" data-texte="point1" data-start="#titre:fin+0.6"></li>
    <li id="point2" class="pm-m-monte" data-texte="point2" data-start="#point1+1.6"></li>
    <li id="point3" class="pm-m-monte" data-texte="point3" data-start="#point2+1.6"></li>
    <li id="point4" class="pm-m-monte" data-texte="point4" data-start="#point3+1.6"></li>
  </ul>
</section>
