<!-- Scène toute faite « etape » (style riso) : le numéro sur un rond d'encre claire, puis ce qu'il faut faire. Durée conseillée : 8 s.
     Textes : numero (≤ 2 car.), titre (≤ 30 car.), texte (≤ 64 car.). -->
<section data-scene="etape" data-encre="style">
  <div class="decor">
    <span class="aplat colline pm-m-monte" data-riso="demi primaire trame" data-decor data-start="0.2" data-dur="8" data-tween="--x 0cqh→3cqh sine-inout"></span>
    <span class="grain"></span>
  </div>
  <div class="etape">
    <div class="bloc-numero">
      <span class="aplat rond pm-m-pop" data-riso="rond neutre" data-start="0.3"></span>
      <p id="numero" class="numero pm-m-pop" data-texte="numero" data-start="0.5"></p>
    </div>
    <div class="etape-texte">
      <h2 id="titre" class="titre-moyen" data-texte="titre" data-mots="monte" data-start="#numero+0.7" data-dur="0.9"></h2>
      <p id="texte" class="texte" data-texte="texte" data-mots="monte" data-start="#titre:fin+0.2" data-dur="1"></p>
    </div>
  </div>
  <i data-annoter="souligne" data-cible="#titre" data-start="#texte:fin+0.3" data-dur="0.6" data-couleur="accent-encre"></i>
</section>
