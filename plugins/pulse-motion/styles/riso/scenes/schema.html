<!-- Scène toute faite « schema » (style riso) : trois idées reliées par des flèches à l'encre primaire ; celle du milieu surlignée à l'encre claire. Durée conseillée : 8 s.
     Textes : titre (≤ 30 car.), a, b, c (≤ 16 car.). -->
<section data-scene="schema" data-encre="style">
  <div class="decor">
    <span class="aplat colline pm-m-monte" data-riso="demi accent trame" data-decor data-start="0.2" data-dur="8" data-tween="--x 0cqh→3cqh sine-inout"></span>
    <span class="grain"></span>
  </div>
  <h2 id="titre" class="titre-moyen" data-texte="titre" data-mots="monte" data-start="0.3" data-dur="0.9"></h2>
  <div class="chaine">
    <div id="a" class="idee pm-m-monte" data-texte="a" data-start="#titre:fin+0.2"></div>
    <span class="connecteur" aria-hidden="true"><i id="lien1" data-fleche="#a → #b" data-start="#a+0.6" data-dur="0.6" data-couleur="primaire"></i></span>
    <div id="b" class="idee pm-m-monte" data-texte="b" data-start="#lien1:fin"></div>
    <span class="connecteur" aria-hidden="true"><i id="lien2" data-fleche="#b → #c" data-start="#b+0.6" data-dur="0.6" data-couleur="primaire"></i></span>
    <div id="c" class="idee pm-m-monte" data-texte="c" data-start="#lien2:fin"></div>
  </div>
  <i data-annoter="surligne" data-cible="#b" data-start="#c+0.8" data-dur="0.6" data-couleur="encre-neutre"></i>
</section>
