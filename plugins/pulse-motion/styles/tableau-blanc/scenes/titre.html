<!-- Scène toute faite « titre » (style tableau-blanc) : l'étiquette, puis le titre s'écrivent au feutre ; un feutre flotte et se gare, le titre se souligne. Durée conseillée : 7 s.
     Textes : etiquette (≤ 22 car.), titre (≤ 30 car.), sous (≤ 46 car.). Décor : data-dur = durée de la scène. -->
<section data-scene="titre" data-encre="style">
  <div class="decor">
    <span class="reflet" data-decor data-start="0" data-dur="7" data-tween="--x -24cqh→24cqh linear"></span>
    <span class="fantomes"></span>
    <span class="feutre" data-start="0.2" data-dur="4.6"></span>
  </div>
  <p id="etiquette" class="etiquette" data-texte="etiquette" data-lettres="ecrit" data-start="0.5" data-dur="0.8"></p>
  <h1 id="titre" class="titre" data-texte="titre" data-lettres="ecrit" data-start="#etiquette:fin+0.1" data-dur="2"></h1>
  <i data-annoter="souligne" data-cible="#titre" data-start="#titre:fin" data-dur="0.6" data-couleur="accent-lisible"></i>
  <p id="sous" class="texte" data-texte="sous" data-lettres="ecrit" data-start="#titre:fin+0.4" data-dur="1.3"></p>
</section>
