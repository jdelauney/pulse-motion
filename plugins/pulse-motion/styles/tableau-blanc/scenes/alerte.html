<!-- Scène toute faite « alerte » (style tableau-blanc) : ce qu'il ne faut pas oublier, écrit puis encadré à l'accent, l'aimant posé dessus. Durée conseillée : 8 s.
     Textes : titre (≤ 30 car.), texte (≤ 64 car.). -->
<section data-scene="alerte" data-encre="style">
  <div class="decor">
    <span class="reflet" data-decor data-start="0" data-dur="8" data-tween="--x -24cqh→24cqh linear"></span>
    <span class="fantomes"></span>
  </div>
  <div id="boite" class="cadre-alerte">
    <h2 id="titre" class="titre-moyen compte" data-texte="titre" data-lettres="ecrit" data-start="0.4" data-dur="1.4"></h2>
    <p id="texte" class="texte" data-texte="texte" data-lettres="ecrit" data-start="#titre:fin+0.2" data-dur="1.8"></p>
  </div>
  <i data-annoter="encadre" data-cible="#boite" data-start="#texte:fin" data-dur="0.7" data-couleur="accent-lisible" data-epaisseur="0.6"></i>
</section>
