<!-- Scène toute faite « conclusion » (style info-sans-son) : la légende à retenir, son mot-clé, le logo. Durée conseillée : 6 s.
     Textes : titre (≤ 34 car.), sous (≤ 44 car.). Logo : celui de la charte (sinon supprimer l'image).
     Dernière scène de la vidéo : data-dur du décor = durée de la scène − 1 s (image stable d'au moins 0,5 s à la fin). -->
<section data-scene="conclusion">
  <div class="decor">
    <span class="lignes-compte" data-decor data-start="0" data-dur="5" data-tween="--y 0cqh→-5cqh linear"></span>
    <span class="marges"></span>
  </div>
  <h2 id="titre" class="legende" data-texte="titre" data-morceaux="2" data-mot-cle="auto" data-start="0.2" data-dur="0.5"></h2>
  <p id="sous" class="source balaie" data-texte="sous" data-start="#titre:fin+0.5" data-dur="0.4"></p>
  <img id="logo" class="logo claque" data-logo alt="" data-start="#sous:fin+0.3" data-dur="0.2">
</section>
