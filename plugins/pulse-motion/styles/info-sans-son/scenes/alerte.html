<!-- Scène toute faite « alerte » (style info-sans-son) : l'avertissement entre crochets d'angle, un mot-clé sur l'accent. Durée conseillée : 7 s.
     Textes : titre (≤ 34 car.), texte (≤ 70 car.). Mot-clé : data-mot-cle="auto" ou le mot voulu. -->
<section data-scene="alerte">
  <div class="decor">
    <span class="lignes-compte" data-decor data-start="0" data-dur="7" data-tween="--y 0cqh→-5cqh linear"></span>
    <span class="marges"></span>
  </div>
  <div id="boite" class="crochets claque" data-start="0.2" data-dur="0.2">
    <h2 id="titre" class="legende" data-texte="titre" data-morceaux="2" data-mot-cle="auto" data-start="#boite:fin+0.1" data-dur="0.5"></h2>
    <p id="texte" class="texte balaie" data-texte="texte" data-start="#titre:fin+0.5" data-dur="0.4"></p>
  </div>
</section>
