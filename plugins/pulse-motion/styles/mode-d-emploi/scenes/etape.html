<!-- Scène toute faite « etape » (style mode-d-emploi) : le numéro se pose sur son disque, le guide montre ce qu'il faut faire, et sa main travaille. Durée conseillée : 8 s.
     Textes : numero (≤ 2 car.), titre (≤ 30 car.), texte (≤ 64 car.). Le guide : personnage « guide » du plugin. -->
<section data-scene="etape">
  <div class="decor">
    <span class="piece bloc" data-aplat data-decor data-start="0" data-dur="8" data-tween="--x 0cqh→-3cqh linear"></span>
    <span class="piece barre" data-aplat data-decor data-start="0" data-dur="8" data-tween="--y 0cqh→2cqh linear"></span>
  </div>
  <div id="guide" class="guide" data-personnage="guide" data-vue="40">
    <i data-action="pose" data-pose="montrer" data-start="#titre" data-dur="5.6"></i>
  </div>
  <div class="etape">
    <div id="disque" class="disque-numero pm-m-saccade" data-aplat="rond" data-start="0.4"><p id="numero" class="numero" data-texte="numero"></p></div>
    <div class="etape-texte">
      <h2 id="titre" class="titre-moyen pm-m-saccade" data-texte="titre" data-start="#disque+0.8" data-dur="0.6"></h2>
      <p id="texte" class="texte pm-m-saccade" data-texte="texte" data-start="#titre:fin+0.4" data-dur="0.6"></p>
    </div>
  </div>
</section>
