<!-- Scène toute faite « moyeu » (style energique) : une idée au centre et 3 à 5 blocs reliés par des flèches épaisses. Durée conseillée : 10 s.
     Textes : titre (≤ 40 car.), centre (≤ 24 car.), partie1 … partie5 (≤ 22 car. chacune ; en 9:16, ≤ 14 car.).
     Moins de 5 parties : supprimer la partie en trop et sa flèche (la couronne se refait seule). Adapter data-dur du décor à la durée de la scène. -->
<section data-scene="moyeu">
  <div class="decor">
    <span class="bandes" data-decor data-start="0" data-dur="10" data-tween="--x 0cqh→-35cqh linear"></span>
  </div>
  <h2 id="titre" class="cri-moyen claque" data-texte="titre" data-start="0.2" data-dur="0.7"></h2>
  <div class="moyeu">
    <div id="centre" class="maillon moyeu-centre tombe" data-texte="centre" data-start="#titre:fin+0.2" data-dur="0.8"></div>
    <div id="partie1" class="maillon moyeu-partie tombe" style="--i: 0" data-texte="partie1" data-start="#centre:fin+0.4" data-dur="0.6"></div>
    <i data-fleche="#centre → #partie1" data-start="#partie1" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.8"></i>
    <div id="partie2" class="maillon moyeu-partie tombe" style="--i: 1" data-texte="partie2" data-start="#partie1:fin+0.5" data-dur="0.6"></div>
    <i data-fleche="#centre → #partie2" data-start="#partie2" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.8"></i>
    <div id="partie3" class="maillon moyeu-partie tombe" style="--i: 2" data-texte="partie3" data-start="#partie2:fin+0.5" data-dur="0.6"></div>
    <i data-fleche="#centre → #partie3" data-start="#partie3" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.8"></i>
    <div id="partie4" class="maillon moyeu-partie tombe" style="--i: 3" data-texte="partie4" data-start="#partie3:fin+0.5" data-dur="0.6"></div>
    <i data-fleche="#centre → #partie4" data-start="#partie4" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.8"></i>
    <div id="partie5" class="maillon moyeu-partie tombe" style="--i: 4" data-texte="partie5" data-start="#partie4:fin+0.5" data-dur="0.6"></div>
    <i data-fleche="#centre → #partie5" data-start="#partie5" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.8"></i>
  </div>
</section>
