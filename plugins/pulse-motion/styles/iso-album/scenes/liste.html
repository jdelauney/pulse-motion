<!-- Scène toute faite « liste » (style iso-album) : la règle dans l'ordre ; à chaque point, une personne vient prendre sa place dans la file. Durée conseillée : 12 s.
     Textes : titre (≤ 32 car.), point1 … point4 (≤ 36 car.). Moins de 4 points : supprimer les points en trop et leurs personnes (la dernière d'abord). -->
<section data-scene="liste">
  <div class="decor">
    <span class="nuage" data-decor data-start="0" data-dur="12"></span>
    <span class="nuage" data-decor data-start="0" data-dur="12"></span>
  </div>
  <h2 id="titre" class="titre-moyen arrive" data-texte="titre" data-start="0.4"></h2>
  <div class="une">
    <ol class="faits">
      <li id="point1" class="arrive" data-texte="point1" data-start="1.8"></li>
      <li id="point2" class="arrive" data-texte="point2" data-start="#point1+2.2"></li>
      <li id="point3" class="arrive" data-texte="point3" data-start="#point2+2.2"></li>
      <li id="point4" class="arrive" data-texte="point4" data-start="#point3+2.2"></li>
    </ol>
    <div class="iso" data-iso>
      <i data-iso-extruder="0,0 7.4,0 7.4,3.6 0,3.6" data-iso-h="0.25" data-couleur="iso2"></i>
      <i data-iso-boite="0.4 0.6 0.25 1 2.2 1" data-couleur="accent"></i>
      <i data-iso-boite="2.2 1.3 0.25 0.8 0.8 0.04" data-couleur="iso6"></i>
      <i data-iso-boite="3.4 1.3 0.25 0.8 0.8 0.04" data-couleur="iso6"></i>
      <i data-iso-boite="4.6 1.3 0.25 0.8 0.8 0.04" data-couleur="iso6"></i>
      <i data-iso-boite="5.8 1.3 0.25 0.8 0.8 0.04" data-couleur="iso6"></i>
      <i data-iso-personne="2.6 1.7 0.25" data-iso-depuis="7.2 3.2 0.25" data-couleur="primaire" class="iso-entre" data-start="1.8" data-dur="1.6"></i>
      <i data-iso-personne="3.8 1.7 0.25" data-iso-depuis="7.2 3.2 0.25" data-couleur="iso3" class="iso-entre" data-start="4" data-dur="1.4"></i>
      <i data-iso-personne="5 1.7 0.25" data-iso-depuis="7.2 3.2 0.25" data-couleur="iso5" class="iso-entre" data-start="6.2" data-dur="1.2"></i>
      <i data-iso-personne="6.2 1.7 0.25" data-iso-depuis="7.2 3.2 0.25" data-couleur="iso1" class="iso-entre" data-start="8.4" data-dur="1"></i>
    </div>
  </div>
</section>
