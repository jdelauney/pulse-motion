<!-- Scène toute faite « schema » (style iso-album) : trois lieux du parcours, reliés par des flèches ; celui du milieu à l'accent. Durée conseillée : 8 s.
     Textes : titre (≤ 32 car.), a, b, c (≤ 14 car.). -->
<section data-scene="schema">
  <div class="decor">
    <span class="nuage" data-decor data-start="0" data-dur="8"></span>
    <span class="nuage" data-decor data-start="0" data-dur="8"></span>
  </div>
  <h2 id="titre" class="titre-moyen arrive" data-texte="titre" data-start="0.3"></h2>
  <div class="chaine">
    <div class="maillon">
      <div class="iso" data-iso>
        <i data-iso-extruder="0,0 3,0 3,3 0,3" data-iso-h="0.25" data-couleur="iso2"></i>
        <i data-iso-boite="0 0 0.25 3 0.25 1.6" data-couleur="iso4"></i>
        <i data-iso-boite="1 0.25 0.25 1 0.1 1.3" data-couleur="iso3" class="iso-monte" data-start="#a" data-dur="0.6"></i>
      </div>
      <p id="a" class="repere arrive" data-texte="a" data-start="#titre+0.7" data-dur="0.6"></p>
    </div>
    <span class="connecteur" aria-hidden="true"><i id="lien1" data-fleche="#a → #b" data-start="#a:fin" data-dur="0.6" data-couleur="texte"></i></span>
    <div class="maillon">
      <div class="iso" data-iso>
        <i data-iso-extruder="0,0 3,0 3,3 0,3" data-iso-h="0.25" data-couleur="iso2"></i>
        <i data-iso-boite="0.6 0.5 0.25 1.8 0.9 0.9" data-couleur="accent" class="iso-monte" data-start="#b" data-dur="0.6"></i>
        <i data-iso-personne="1.5 2.1 0.25" data-couleur="primaire"></i>
      </div>
      <p id="b" class="repere compte arrive" data-texte="b" data-start="#lien1:fin" data-dur="0.6"></p>
    </div>
    <span class="connecteur" aria-hidden="true"><i id="lien2" data-fleche="#b → #c" data-start="#b:fin" data-dur="0.6" data-couleur="texte"></i></span>
    <div class="maillon">
      <div class="iso" data-iso>
        <i data-iso-extruder="0,0 3,0 3,3 0,3" data-iso-h="0.25" data-couleur="iso2"></i>
        <i data-iso-boite="0.5 0.6 0.25 0.8 0.8 0.5" data-couleur="iso5" class="iso-pose" data-start="#c" data-dur="0.6"></i>
        <i data-iso-boite="1.7 0.6 0.25 0.8 0.8 0.5" data-couleur="iso5" class="iso-pose" data-start="#c+0.2" data-dur="0.6"></i>
        <i data-iso-cylindre="1.5 2.2 0.25 0.35 0.7" data-couleur="iso1"></i>
      </div>
      <p id="c" class="repere arrive" data-texte="c" data-start="#lien2:fin" data-dur="0.6"></p>
    </div>
  </div>
</section>
