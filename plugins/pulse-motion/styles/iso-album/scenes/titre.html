<!-- Scène toute faite « titre » (style iso-album) : le lieu, l'étiquette écrite au sol lettre à lettre, deux personnes qui entrent, puis le titre. Durée conseillée : 7 s.
     Textes : etiquette (≤ 18 car., posée au sol), titre (≤ 32 car.), sous (≤ 46 car.). Décor : data-dur = durée de la scène. -->
<section data-scene="titre">
  <div class="decor">
    <span class="nuage" data-decor data-start="0" data-dur="7"></span>
    <span class="nuage" data-decor data-start="0" data-dur="7"></span>
  </div>
  <div class="une">
    <div class="textes">
      <h1 id="titre" class="titre arrive" data-texte="titre" data-start="1.4"></h1>
      <p id="sous" class="texte arrive" data-texte="sous" data-start="#titre+1.2"></p>
    </div>
    <div class="iso" data-iso>
      <i data-iso-extruder="0,0 9,0 9,6 0,6" data-iso-h="0.25" data-couleur="iso2"></i>
      <i data-iso-boite="0 0 0.25 9 0.3 2.2" data-couleur="iso4"></i>
      <i data-iso-boite="0 0.3 0.25 0.3 5.7 2.2" data-couleur="iso4"></i>
      <i data-iso-boite="6 0.3 0.25 1.3 0.1 1.7" data-couleur="iso3"></i>
      <i data-iso-boite="1.4 1.3 0.25 2.6 1 0.9" data-couleur="iso5"></i>
      <i data-iso-cylindre="8.2 1.1 0.25 0.35 0.5" data-couleur="iso4"></i>
      <i data-iso-cylindre="8.2 1.1 0.75 0.55 0.7" data-couleur="iso1"></i>
      <i data-iso-personne="3.4 2.9 0.25" data-iso-depuis="7.6 5.4 0.25" data-couleur="primaire" class="iso-entre" data-start="1" data-dur="2.6"></i>
      <i data-iso-personne="4.6 3.5 0.25" data-iso-depuis="8.6 5.6 0.25" data-couleur="iso3" class="iso-entre" data-start="2" data-dur="2.6"></i>
      <p id="etiquette" class="au-sol" data-texte="etiquette" data-iso-ancre="4.7 4.1 0.25" data-lettres="ecrit" data-start="0.5" data-dur="1.4"></p>
    </div>
  </div>
</section>
