<!-- Scène toute faite « conclusion » (style lancement) : le message que la lumière balaie, et le logo. Durée conseillée : 6 s.
     Textes : titre (≤ 36 car.), sous (≤ 50 car.). Logo : celui de la charte (sinon supprimer l'image).
     Dernière scène de la vidéo : data-dur du décor = durée de la scène − 1 s (image stable d'au moins 0,5 s à la fin). -->
<section data-scene="conclusion">
  <div class="decor">
    <span class="grille" data-decor data-start="0" data-dur="5" data-tween="--y 0cqh→-8cqh linear"></span>
    <span class="lumiere" data-decor data-start="0" data-dur="5" data-tween="--lx 22%→68% sine-inout"></span>
    <span class="voile"></span>
  </div>
  <h2 id="titre" class="titre reflet monte" data-texte="titre" data-start="0.3" data-dur="0.6"></h2>
  <p id="sous" class="texte monte" data-texte="sous" data-start="#titre:fin+0.3" data-dur="0.5"></p>
  <img id="logo" class="logo monte" data-logo alt="" data-start="#sous:fin+0.3" data-dur="0.5">
</section>
