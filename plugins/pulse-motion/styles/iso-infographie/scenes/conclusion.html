<!-- Scène toute faite « conclusion » (style iso-infographie) : le recul jusqu'à l'infographie finie, la leçon, puis le logo. Durée conseillée : 6 s.
     Textes : titre (≤ 32 car.), sous (≤ 44 car.). Logo : celui de la charte (sinon supprimer l'image).
     Dernière scène de la vidéo : data-dur du décor = durée de la scène − 1 s (image stable d'au moins 0,5 s à la fin). -->
<section data-scene="conclusion">
  <div class="decor">
    <span class="losange" data-decor data-start="0" data-dur="5"></span>
    <span class="losange" data-decor data-start="0" data-dur="5"></span>
  </div>
  <div class="une">
    <div class="textes">
      <h2 id="titre" class="titre arrive" data-texte="titre" data-start="0.4"></h2>
      <p id="sous" class="texte arrive" data-texte="sous" data-start="#titre+1"></p>
      <img id="logo" class="logo" data-logo alt="" data-start="#sous+0.8" data-dur="0.5" data-tween="opacity 0→1">
    </div>
    <div class="iso recule" data-iso data-start="0" data-dur="3">
      <i data-iso-extruder="0,0 8,0 8,6 0,6" data-iso-h="0.3" data-couleur="iso4"></i>
      <i data-iso-boite="0.8 0.8 0.3 3.4 2.6 1.8" data-couleur="iso1"></i>
      <i data-iso-prisme="0.8 0.8 2.1 3.4 2.6 0.9" data-couleur="iso3"></i>
      <i data-iso-boite="4.2 1.4 1.2 1.2 0.5 0.4" data-couleur="iso6"></i>
      <i data-iso-cylindre="6.1 1.7 0.3 0.8 2.2" data-couleur="accent"></i>
      <i data-iso-boite="4.4 3.8 0.3 2.2 1.3 1.1" data-couleur="iso2"></i>
      <i data-iso-boite="6.6 3.9 0.3 0.8 1.1 0.9" data-couleur="iso1"></i>
      <i data-iso-isotype="0.9 4.4 0.3 4" data-iso-pas="0.95" data-couleur="primaire" data-start="1.6" data-dur="1"></i>
    </div>
  </div>
</section>
