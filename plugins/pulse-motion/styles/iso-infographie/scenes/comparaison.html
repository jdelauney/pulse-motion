<!-- Scène toute faite « comparaison » (style iso-infographie) : deux maquettes ; quand la seconde arrive, la première passe au gris (focus et contexte). Durée conseillée : 12 s.
     Textes : titre (≤ 32 car.), gauche-titre et droite-titre (≤ 16 car.), gauche-texte et droite-texte (≤ 48 car.). -->
<section data-scene="comparaison">
  <div class="decor">
    <span class="losange" data-decor data-start="0" data-dur="12"></span>
    <span class="losange" data-decor data-start="0" data-dur="12"></span>
  </div>
  <h2 id="titre" class="titre-moyen arrive" data-texte="titre" data-start="0.4"></h2>
  <div class="duo">
    <div id="gauche" class="cote arrive" data-start="#titre+1">
      <div class="iso focus" data-iso data-start="#droite" data-dur="0.8">
        <i data-iso-extruder="0,0 4,0 4,3 0,3" data-iso-h="0.25" data-couleur="iso4"></i>
        <i data-iso-boite="0.5 0.5 0.25 1.4 1.4 1.4" data-couleur="iso1" class="iso-monte" data-start="#gauche+0.3" data-dur="0.7"></i>
        <i data-iso-boite="2.3 0.7 0.25 1.2 1.2 0.8" data-couleur="iso2" class="iso-monte" data-start="#gauche+0.6" data-dur="0.7"></i>
      </div>
      <h3 class="cote-titre" data-texte="gauche-titre"></h3>
      <p class="texte" data-texte="gauche-texte"></p>
    </div>
    <div id="droite" class="cote compte arrive" data-start="#gauche+3.4">
      <div class="iso" data-iso>
        <i data-iso-extruder="0,0 4,0 4,3 0,3" data-iso-h="0.25" data-couleur="iso4"></i>
        <i data-iso-boite="0.5 0.5 0.25 1.4 1.4 2.4" data-couleur="accent" class="iso-monte" data-start="#droite+0.3" data-dur="0.8"></i>
        <i data-iso-boite="2.3 0.7 0.25 1.2 1.2 1.6" data-couleur="iso1" class="iso-monte" data-start="#droite+0.6" data-dur="0.8"></i>
      </div>
      <h3 class="cote-titre" data-texte="droite-titre"></h3>
      <p class="texte" data-texte="droite-texte"></p>
    </div>
  </div>
</section>
