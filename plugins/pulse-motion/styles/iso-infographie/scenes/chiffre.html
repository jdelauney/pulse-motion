<!-- Scène toute faite « chiffre » (style iso-infographie) : la valeur compte pendant que la pile monte et que les silhouettes arrivent une à une (Isotype). Durée conseillée : 7 s.
     Textes : titre (≤ 32 car.), unite (≤ 3 car., vide si aucune), legende (≤ 46 car.). Valeur : remplacer 1250 dans « nombre 0→1250 ».
     Les silhouettes ne disent pas une proportion : pour en montrer une, une silhouette par unité dans une scène composée. -->
<section data-scene="chiffre">
  <div class="decor">
    <span class="losange" data-decor data-start="0" data-dur="7"></span>
    <span class="losange" data-decor data-start="0" data-dur="7"></span>
  </div>
  <div class="une">
    <div class="mesure">
      <h2 id="titre" class="titre-moyen arrive" data-texte="titre" data-start="0.4"></h2>
      <p id="nombre" class="nombre compte"><span id="valeur" data-start="#titre+0.8" data-dur="1.6" data-tween="nombre 0→1250 cubic-out">0</span><span class="unite" data-texte="unite"></span></p>
      <p id="legende" class="texte arrive" data-texte="legende" data-start="#valeur:fin+0.4"></p>
    </div>
    <div class="iso" data-iso>
      <i data-iso-extruder="0,0 6,0 6,5 0,5" data-iso-h="0.3" data-couleur="iso4"></i>
      <i data-iso-boite="0.6 0.6 0.3 2 2 1" data-couleur="iso1" class="iso-pose" data-start="#titre+0.8" data-dur="0.6"></i>
      <i data-iso-boite="0.6 0.6 1.3 2 2 1" data-couleur="iso2" class="iso-pose" data-start="#titre+1.2" data-dur="0.6"></i>
      <i data-iso-boite="0.6 0.6 2.3 2 2 1" data-couleur="accent" class="iso-pose sujet" data-start="#titre+1.6" data-dur="0.6"></i>
      <i data-iso-isotype="2.6 3.6 0.3 4" data-iso-pas="1" data-couleur="primaire" data-start="#titre+0.9" data-dur="1.2"></i>
    </div>
  </div>
</section>
