<!-- Scène toute faite « conclusion » (style carnet) : ce qu'il faut retenir s'écrit, une seule ligne en fait le tour, puis le logo. Durée conseillée : 6 s.
     Textes : titre (≤ 30 car.), sous (≤ 44 car.). Logo : celui de la charte (sinon supprimer l'image).
     Dernière scène de la vidéo : data-dur du décor = durée de la scène − 1 s (image stable d'au moins 0,5 s à la fin). -->
<section data-scene="conclusion">
  <div class="decor">
    <span class="fibres" data-decor data-start="0" data-dur="5" data-tween="--x 0cqh→-3cqh linear"></span>
    <span class="reliure"></span>
  </div>
  <h2 id="titre" class="titre" data-texte="titre" data-lettres="ecrit" data-start="0.3" data-dur="1.4"></h2>
  <i data-une-ligne="#titre" data-start="#titre:fin" data-dur="1.5" data-couleur="accent-lisible"></i>
  <p id="sous" class="texte" data-texte="sous" data-mots="monte" data-start="#titre:fin+0.5" data-dur="0.8"></p>
  <img id="logo" class="logo" data-logo alt="" data-start="#sous:fin+0.2" data-dur="0.5" data-tween="opacity 0→1">
</section>
