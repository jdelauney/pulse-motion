<!-- Scène toute faite « comparaison » (style carnet) : deux croquis côte à côte ; le second, celui qui compte, hachuré et encadré à l'accent. Durée conseillée : 12 s.
     Textes : titre (≤ 30 car.), gauche-titre et droite-titre (≤ 16 car.), gauche-texte et droite-texte (≤ 48 car.). -->
<section data-scene="comparaison">
  <div class="decor">
    <span class="fibres" data-decor data-start="0" data-dur="12" data-tween="--x 0cqh→-3cqh linear"></span>
    <span class="reliure"></span>
  </div>
  <h2 id="titre" class="titre-moyen" data-texte="titre" data-lettres="ecrit" data-start="0.4" data-dur="1.4"></h2>
  <div class="croquis">
    <div id="gauche" class="vignette" data-start="#titre:fin+0.3">
      <h3 id="gauche-titre" class="vignette-titre" data-texte="gauche-titre" data-lettres="ecrit" data-start="#titre:fin+0.3" data-dur="0.8"></h3>
      <p id="gauche-texte" class="texte" data-texte="gauche-texte" data-mots="monte" data-start="#gauche-titre:fin+0.1" data-dur="0.9"></p>
    </div>
    <div id="droite" class="vignette" data-start="#gauche-texte:fin+1.6">
      <span class="hachures" data-start="#droite-texte:fin" data-dur="0.8"></span>
      <h3 id="droite-titre" class="vignette-titre" data-texte="droite-titre" data-lettres="ecrit" data-start="#gauche-texte:fin+1.6" data-dur="0.8"></h3>
      <p id="droite-texte" class="texte" data-texte="droite-texte" data-mots="monte" data-start="#droite-titre:fin+0.1" data-dur="0.9"></p>
    </div>
  </div>
  <i data-annoter="encadre" data-cible="#gauche" data-start="#gauche-texte:fin" data-dur="0.6" data-couleur="texte"></i>
  <i data-annoter="encadre" data-cible="#droite" data-start="#droite-texte:fin" data-dur="0.6" data-couleur="accent-lisible"></i>
</section>
