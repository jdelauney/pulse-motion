<!-- Scène toute faite « titre » (style carnet) : l'étiquette et le titre s'écrivent, puis une seule ligne en fait le tour ; le sous-titre arrive. Durée conseillée : 7 s.
     Textes : etiquette (≤ 22 car.), titre (≤ 30 car.), sous (≤ 46 car.). Décor : data-dur = durée de la scène. -->
<section data-scene="titre">
  <div class="decor">
    <span class="fibres" data-decor data-start="0" data-dur="7" data-tween="--x 0cqh→-3cqh linear"></span>
    <span class="reliure"></span>
  </div>
  <p id="etiquette" class="etiquette" data-texte="etiquette" data-lettres="ecrit" data-start="0.4" data-dur="0.8"></p>
  <h1 id="titre" class="titre" data-texte="titre" data-lettres="ecrit" data-start="#etiquette:fin+0.1" data-dur="1.8"></h1>
  <i data-une-ligne="#titre" data-start="#titre:fin" data-dur="1.8" data-couleur="accent-lisible"></i>
  <p id="sous" class="texte" data-texte="sous" data-mots="monte" data-start="#titre:fin+0.6" data-dur="0.9"></p>
</section>
