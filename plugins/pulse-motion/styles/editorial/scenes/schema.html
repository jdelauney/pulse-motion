<!-- Scène toute faite « schema » (style editorial) : trois temps reliés par des flèches fines. Durée conseillée : 8 s.
     Textes : titre (≤ 40 car.), a, b, c (≤ 25 car.). -->
<section data-scene="schema">
  <div class="decor">
    <span class="ligne" data-decor data-start="0" data-dur="8" data-tween="--l 0→1 sine-inout"></span>
  </div>
  <h2 id="titre" class="titre-moyen masque" data-texte="titre" data-start="0.2" data-dur="1.1"></h2>
  <div class="chaine">
    <div id="a" class="maillon fondu" data-texte="a" data-start="#titre:fin+0.3" data-dur="0.9"></div>
    <svg id="lien1" class="lien" viewBox="0 0 60 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" data-start="#a:fin" data-dur="0.8" aria-hidden="true">
      <path pathLength="100" d="M1 6h56M51 1l6 5-6 5"/>
    </svg>
    <div id="b" class="maillon fondu" data-texte="b" data-start="#lien1:fin" data-dur="0.9"></div>
    <svg id="lien2" class="lien" viewBox="0 0 60 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" data-start="#b:fin" data-dur="0.8" aria-hidden="true">
      <path pathLength="100" d="M1 6h56M51 1l6 5-6 5"/>
    </svg>
    <div id="c" class="maillon fondu" data-texte="c" data-start="#lien2:fin" data-dur="0.9"></div>
  </div>
</section>
