<!-- Scène toute faite « comparaison » (style crayon) : deux pages côte à côte, encadrées au crayon ; la seconde, celle qui compte, reçoit le lavis et le crayon d'accent. Durée conseillée : 12 s.
     Textes : titre (≤ 30 car.), gauche-titre et droite-titre (≤ 16 car.), gauche-texte et droite-texte (≤ 48 car.). -->
<section data-scene="comparaison" data-encre="style">
  <div class="decor">
    <span class="page"></span>
    <span class="crayons" data-decor data-start="0" data-dur="12" data-tween="--x 0cqh→-3cqh linear"><span class="marqueur"></span><span class="marqueur"></span><span class="marqueur"></span></span>
  </div>
  <h2 id="titre" class="titre-moyen" data-texte="titre" data-lettres="ecrit" data-start="0.4" data-dur="1.4"></h2>
  <div class="pages">
    <div id="gauche" class="vignette" data-start="#titre:fin+0.3">
      <h3 id="gauche-titre" class="vignette-titre" data-texte="gauche-titre" data-lettres="ecrit" data-start="#titre:fin+0.3" data-dur="0.8"></h3>
      <p id="gauche-texte" class="texte" data-texte="gauche-texte" data-mots="monte" data-start="#gauche-titre:fin+0.1" data-dur="0.9"></p>
    </div>
    <div id="droite" class="vignette" data-start="#gauche-texte:fin+1.6">
      <span class="lavis" data-start="#droite-texte:fin+0.4" data-dur="1"></span>
      <h3 id="droite-titre" class="vignette-titre compte" data-texte="droite-titre" data-lettres="ecrit" data-start="#gauche-texte:fin+1.6" data-dur="0.8"></h3>
      <p id="droite-texte" class="texte" data-texte="droite-texte" data-mots="monte" data-start="#droite-titre:fin+0.1" data-dur="0.9"></p>
    </div>
  </div>
  <i data-annoter="encadre" data-cible="#gauche" data-start="#gauche-texte:fin" data-dur="0.6" data-couleur="crayon-gris" data-epaisseur="0.7"></i>
  <i data-annoter="encadre" data-cible="#droite" data-start="#droite-texte:fin" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.7"></i>
</section>
