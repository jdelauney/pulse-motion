<!-- Scène toute faite « chiffre » (style crayon) : le chiffre compte, le crayon d'accent l'entoure, puis le lavis passe dessous et le révèle ; la légende arrive. Durée conseillée : 7 s.
     Textes : titre (≤ 30 car.), unite (≤ 3 car., vide si aucune), legende (≤ 46 car.). Valeur : remplacer 1250 dans « nombre 0→1250 ». -->
<section data-scene="chiffre" data-encre="style">
  <div class="decor">
    <span class="page"></span>
    <span class="crayons" data-decor data-start="0" data-dur="7" data-tween="--x 0cqh→-2cqh linear"><span class="marqueur"></span><span class="marqueur"></span><span class="marqueur"></span></span>
  </div>
  <h2 id="titre" class="titre-moyen" data-texte="titre" data-lettres="ecrit" data-start="0.4" data-dur="1.4"></h2>
  <div class="mesure">
    <span class="lavis chaud" data-start="#valeur:fin+0.5" data-dur="1"></span>
    <p id="nombre" class="nombre"><span id="valeur" data-start="#titre:fin+0.2" data-dur="1.4" data-tween="nombre 0→1250 cubic-out">0</span><span class="unite" data-texte="unite"></span></p>
    <i data-annoter="entoure" data-cible="#nombre" data-start="#valeur:fin" data-dur="0.8" data-couleur="accent-lisible" data-epaisseur="0.7"></i>
  </div>
  <p id="legende" class="texte" data-texte="legende" data-mots="monte" data-start="#valeur:fin+1.2" data-dur="0.9"></p>
</section>
