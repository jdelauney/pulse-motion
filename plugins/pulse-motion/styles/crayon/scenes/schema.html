<!-- Scène toute faite « schema » (style crayon) : trois idées écrites et reliées par des flèches au crayon ; celle du milieu entourée au crayon d'accent. Durée conseillée : 8 s.
     Textes : titre (≤ 30 car.), a, b, c (≤ 16 car.). -->
<section data-scene="schema" data-encre="style">
  <div class="decor">
    <span class="page"></span>
    <span class="crayons" data-decor data-start="0" data-dur="8" data-tween="--x 0cqh→-2cqh linear"><span class="marqueur"></span><span class="marqueur"></span><span class="marqueur"></span></span>
  </div>
  <h2 id="titre" class="titre-moyen" data-texte="titre" data-lettres="ecrit" data-start="0.3" data-dur="1.2"></h2>
  <div class="chaine">
    <div id="a" class="idee" data-texte="a" data-lettres="ecrit" data-start="#titre:fin+0.2" data-dur="0.8"></div>
    <span class="connecteur" aria-hidden="true"><i id="lien1" data-fleche="#a → #b" data-start="#a:fin" data-dur="0.6" data-couleur="crayon-brun"></i></span>
    <div id="b" class="idee compte" data-texte="b" data-lettres="ecrit" data-start="#lien1:fin" data-dur="0.8"></div>
    <span class="connecteur" aria-hidden="true"><i id="lien2" data-fleche="#b → #c" data-start="#b:fin" data-dur="0.6" data-couleur="crayon-brun"></i></span>
    <div id="c" class="idee" data-texte="c" data-lettres="ecrit" data-start="#lien2:fin" data-dur="0.8"></div>
  </div>
  <i data-annoter="entoure" data-cible="#b" data-start="#c:fin+0.3" data-dur="0.8" data-couleur="accent-lisible" data-epaisseur="0.7"></i>
</section>
