<!-- Scène toute faite « liste » (style tech-sombre) : 2 à 4 lignes de journal qui s'écrivent. Durée conseillée : 12 s.
     Textes : titre (≤ 40 car.), point1 … point4 (≤ 45 car.). Moins de 4 points : supprimer les points en trop. -->
<section data-scene="liste">
  <div class="decor">
    <span class="grille" data-decor data-start="0" data-dur="12" data-tween="--x 0cqh→-16cqh linear; --y 0cqh→-8cqh linear"></span>
  </div>
  <h2 id="titre" class="titre-moyen glisse" data-texte="titre" data-start="0.2" data-dur="0.6"></h2>
  <ol class="journal">
    <li id="point1" class="ecrit" data-texte="point1" data-start="#titre:fin+0.3" data-dur="0.9"></li>
    <li id="point2" class="ecrit" data-texte="point2" data-start="#point1:fin+0.6" data-dur="0.9"></li>
    <li id="point3" class="ecrit" data-texte="point3" data-start="#point2:fin+0.6" data-dur="0.9"></li>
    <li id="point4" class="ecrit" data-texte="point4" data-start="#point3:fin+0.6" data-dur="0.9"></li>
  </ol>
</section>
