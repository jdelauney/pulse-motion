<!-- Scène toute faite « schema » (style tech-sombre) : trois nœuds reliés par des flèches. Durée conseillée : 8 s.
     Textes : titre (≤ 40 car.), a, b, c (≤ 25 car.). -->
<section data-scene="schema">
  <div class="decor">
    <span class="grille" data-decor data-start="0" data-dur="8" data-tween="--x 0cqh→-8cqh linear; --y 0cqh→-4cqh linear"></span>
  </div>
  <h2 id="titre" class="titre-moyen glisse" data-texte="titre" data-start="0.2" data-dur="0.6"></h2>
  <div class="graphe">
    <div id="a" class="noeud glisse" data-texte="a" data-start="#titre:fin+0.3" data-dur="0.6"></div>
    <span class="connecteur" aria-hidden="true"><i id="lien1" data-fleche="#a → #b" data-start="#a:fin" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.4"></i></span>
    <div id="b" class="noeud glisse" data-texte="b" data-start="#lien1:fin" data-dur="0.6"></div>
    <span class="connecteur" aria-hidden="true"><i id="lien2" data-fleche="#b → #c" data-start="#b:fin" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.4"></i></span>
    <div id="c" class="noeud glisse" data-texte="c" data-start="#lien2:fin" data-dur="0.6"></div>
  </div>
</section>
