<!-- Scène toute faite « titre » (style tech-sombre) : ouvrir la vidéo, comme une invite de commande. Durée conseillée : 7 s.
     Textes : etiquette (≤ 25 car.), titre (≤ 40 car.), sous (≤ 50 car.). Décor : data-dur = durée de la scène. -->
<section data-scene="titre">
  <div class="decor">
    <span class="grille" data-decor data-start="0" data-dur="7" data-tween="--x 0cqh→-8cqh linear; --y 0cqh→-4cqh linear"></span>
    <span class="balayage" data-decor data-start="0" data-dur="7" data-tween="--y 0cqh→100cqh linear"></span>
  </div>
  <p id="etiquette" class="invite ecrit" data-texte="etiquette" data-start="0.2" data-dur="0.8"></p>
  <h1 id="titre" class="titre glisse" data-texte="titre" data-start="#etiquette:fin+0.1" data-dur="0.6"></h1>
  <p id="sous" class="texte ecrit curseur" data-texte="sous" data-start="#titre:fin+0.2" data-dur="1.4"></p>
</section>
