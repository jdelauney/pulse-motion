<!-- Scène toute faite « liste » : 2 à 4 points révélés un par un. Durée conseillée : 12 s.
     Textes : titre (≤ 40 car.), point1 … point4 (≤ 45 car. chacun).
     Moins de 4 points : supprimer les <li> en trop. Adapter data-dur des .rond à la durée de la scène. -->
<section data-scene="liste">
  <div class="decor">
    <span class="rond" data-decor style="width: 60cqh; height: 60cqh; right: -20cqh; top: -18cqh" data-start="0" data-dur="12" data-tween="--dy 0cqh→10cqh sine-inout"></span>
  </div>
  <h2 id="titre" class="titre-moyen entre-gauche" data-texte="titre" data-start="0.2" data-dur="0.7"></h2>
  <ul class="liste">
    <li id="point1" class="entre-gauche" data-texte="point1" data-start="#titre:fin+0.4" data-dur="0.7"></li>
    <li id="point2" class="entre-gauche" data-texte="point2" data-start="#point1:fin+0.8" data-dur="0.7"></li>
    <li id="point3" class="entre-gauche" data-texte="point3" data-start="#point2:fin+0.8" data-dur="0.7"></li>
    <li id="point4" class="entre-gauche" data-texte="point4" data-start="#point3:fin+0.8" data-dur="0.7"></li>
  </ul>
</section>
