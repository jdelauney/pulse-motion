<!-- Scène toute faite « moyeu » : une idée au centre et 3 à 5 parties reliées par des flèches qui se tracent. Durée conseillée : 10 s.
     Textes : titre (≤ 40 car.), centre (≤ 24 car.), partie1 … partie5 (≤ 22 car. chacune ; en 9:16, ≤ 14 car.).
     Moins de 5 parties : supprimer la partie en trop et sa flèche (la couronne se refait seule). Adapter data-dur du décor à la durée de la scène. -->
<section data-scene="moyeu">
  <div class="decor">
    <span class="rond accent" data-decor style="width: 50cqh; height: 50cqh; right: -15cqh; bottom: -20cqh" data-start="0" data-dur="10" data-tween="--dx 0cqh→-8cqh sine-inout"></span>
  </div>
  <h2 id="titre" class="titre-moyen entre-bas" data-texte="titre" data-start="0.2" data-dur="0.7"></h2>
  <div class="moyeu">
    <div id="centre" class="boite moyeu-centre zoom" data-texte="centre" data-start="#titre:fin+0.2" data-dur="0.8"></div>
    <div id="partie1" class="boite moyeu-partie zoom" style="--i: 0" data-texte="partie1" data-start="#centre:fin+0.4" data-dur="0.6"></div>
    <i data-fleche="#centre → #partie1" data-start="#partie1" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.6"></i>
    <div id="partie2" class="boite moyeu-partie zoom" style="--i: 1" data-texte="partie2" data-start="#partie1:fin+0.5" data-dur="0.6"></div>
    <i data-fleche="#centre → #partie2" data-start="#partie2" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.6"></i>
    <div id="partie3" class="boite moyeu-partie zoom" style="--i: 2" data-texte="partie3" data-start="#partie2:fin+0.5" data-dur="0.6"></div>
    <i data-fleche="#centre → #partie3" data-start="#partie3" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.6"></i>
    <div id="partie4" class="boite moyeu-partie zoom" style="--i: 3" data-texte="partie4" data-start="#partie3:fin+0.5" data-dur="0.6"></div>
    <i data-fleche="#centre → #partie4" data-start="#partie4" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.6"></i>
    <div id="partie5" class="boite moyeu-partie zoom" style="--i: 4" data-texte="partie5" data-start="#partie4:fin+0.5" data-dur="0.6"></div>
    <i data-fleche="#centre → #partie5" data-start="#partie5" data-dur="0.6" data-couleur="accent-lisible" data-epaisseur="0.6"></i>
  </div>
</section>
