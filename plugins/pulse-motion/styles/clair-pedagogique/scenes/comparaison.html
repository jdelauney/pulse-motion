<!-- Scène toute faite « comparaison » : deux colonnes côte à côte (avant/après, à faire/à éviter). Durée conseillée : 12 s.
     Textes : titre (≤ 40 car.), gauche-titre et droite-titre (≤ 20 car.), gauche-texte et droite-texte (≤ 60 car.).
     Adapter data-dur des .rond à la durée de la scène. -->
<section data-scene="comparaison">
  <div class="decor">
    <span class="rond" data-decor style="width: 50cqh; height: 50cqh; left: -15cqh; bottom: -20cqh" data-start="0" data-dur="12" data-tween="--dx 0cqh→10cqh sine-inout"></span>
  </div>
  <h2 id="titre" class="titre-moyen entre-bas" data-texte="titre" data-start="0.2" data-dur="0.7"></h2>
  <div class="rangee">
    <div id="gauche" class="colonne entre-gauche" data-start="#titre:fin+0.3" data-dur="0.7">
      <h3 class="colonne-titre" data-texte="gauche-titre"></h3>
      <p class="texte" data-texte="gauche-texte"></p>
    </div>
    <div id="droite" class="colonne accent entre-droite" data-start="#gauche:fin+1.2" data-dur="0.7">
      <h3 class="colonne-titre" data-texte="droite-titre"></h3>
      <p class="texte" data-texte="droite-texte"></p>
    </div>
  </div>
</section>
