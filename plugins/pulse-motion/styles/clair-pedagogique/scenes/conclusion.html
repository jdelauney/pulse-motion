<!-- Scène toute faite « conclusion » : le message à retenir et le logo. Durée conseillée : 6 s.
     Textes : titre (≤ 40 car.), sous (≤ 50 car.). Logo : charte.logo du déroulé (sinon supprimer l'<img>).
     Garder au moins 0,5 s immobile à la fin. Adapter data-dur des .rond à la durée de la scène. -->
<section data-scene="conclusion" class="centre">
  <div class="decor">
    <span class="rond" style="width: 70cqh; height: 70cqh; left: 50%; top: 50%; margin: -35cqh 0 0 -35cqh" data-start="0" data-dur="5" data-tween="scale 0.8→1 sine-out"></span>
  </div>
  <h2 id="titre" class="titre entre-bas" data-texte="titre" data-start="0.2" data-dur="0.7"></h2>
  <p id="sous" class="sous-titre entre-bas" data-texte="sous" data-start="#titre:fin+0.2" data-dur="0.7"></p>
  <img id="logo" class="logo fondu" data-logo alt="" data-start="#sous:fin+0.3" data-dur="0.6">
</section>
