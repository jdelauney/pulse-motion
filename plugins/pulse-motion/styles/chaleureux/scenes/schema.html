<!-- Scène toute faite « schema » (style chaleureux) : trois étapes reliées par des flèches courbes qui visent les boîtes. Durée conseillée : 8 s.
     Textes : titre (≤ 40 car.), a, b, c (≤ 25 car.). -->
<section data-scene="schema">
  <div class="decor">
    <span class="galet" data-decor style="width: 46cqh; height: 40cqh; right: -14cqh; bottom: -16cqh" data-start="0" data-dur="8" data-tween="--dx 0cqh→-6cqh sine-inout; --m 0→1 sine-inout"></span>
  </div>
  <h2 id="titre" class="titre-moyen pose" data-texte="titre" data-start="0.2" data-dur="0.9"></h2>
  <div class="parcours">
    <div id="a" class="etiquette-ronde eclot" data-texte="a" data-start="#titre:fin+0.3" data-dur="0.8"></div>
    <span class="courbe" aria-hidden="true"><i id="lien1" data-fleche="#a → #b" data-start="#a:fin" data-dur="0.7" data-couleur="accent-lisible" data-epaisseur="0.55" data-fleche-courbe="0.2"></i></span>
    <div id="b" class="etiquette-ronde eclot" data-texte="b" data-start="#lien1:fin" data-dur="0.8"></div>
    <span class="courbe" aria-hidden="true"><i id="lien2" data-fleche="#b → #c" data-start="#b:fin" data-dur="0.7" data-couleur="accent-lisible" data-epaisseur="0.55" data-fleche-courbe="0.2"></i></span>
    <div id="c" class="etiquette-ronde eclot" data-texte="c" data-start="#lien2:fin" data-dur="0.8"></div>
  </div>
</section>
