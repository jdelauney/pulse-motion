<!-- Scène toute faite « etape » (style chaleureux) : une étape, numéro dans une forme ronde. Durée conseillée : 8 s.
     Textes : numero (≤ 2 car.), titre (≤ 40 car.), texte (≤ 80 car.). -->
<section data-scene="etape">
  <div class="decor">
    <span class="galet" data-decor style="width: 46cqh; height: 40cqh; right: -12cqh; top: -14cqh" data-start="0" data-dur="8" data-tween="--dy 0cqh→6cqh sine-inout"></span>
  </div>
  <div class="etape">
    <span id="numero" class="rond-numero eclot" data-texte="numero" data-start="0.2" data-dur="0.8"></span>
    <div class="etape-texte">
      <h2 id="titre" class="titre-moyen pose" data-texte="titre" data-start="#numero:fin" data-dur="0.9"></h2>
      <p id="texte" class="texte pose" data-texte="texte" data-start="#titre:fin+0.2" data-dur="0.9"></p>
    </div>
  </div>
</section>
