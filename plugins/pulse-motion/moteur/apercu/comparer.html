<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pulse Motion – comparer deux versions</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  .cadres { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; min-height: 0; }
  figure { margin: 0; display: flex; flex-direction: column; min-height: 0; }
  figcaption { padding: 4px 2px; font-weight: 600; }
  iframe { flex: 1; width: 100%; border: 0; background: #000; border-radius: 6px; }
  #barre { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; background: #1b1b1b; }
  #barre button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: #eee; color: #111; cursor: pointer; }
  #barre input { flex: 1; margin: 0; }
  #temps { white-space: nowrap; font-variant-numeric: tabular-nums; }
  #message { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 6px; background: #7b1d14; }
</style>
</head>
<body>
<div class="cadres">
  <figure><figcaption>Maintenant</figcaption><iframe id="courante" title="Version actuelle"></iframe></figure>
  <figure><figcaption id="legende-avant">Avant</figcaption><iframe id="avant" title="Version d'avant"></iframe></figure>
</div>
<div id="barre">
  <button id="lecture" type="button" aria-label="Lecture">▶</button>
  <input id="position" type="range" min="0" max="1" step="0.0333" value="0" aria-label="Position">
  <span id="temps">0:00</span>
</div>
<p id="message" hidden></p>
<script type="module" src="/_pm/apercu/comparer.mjs"></script>
</body>
</html>
