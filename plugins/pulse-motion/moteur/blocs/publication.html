<!-- Bloc « publication » : publication de réseau social générique, sans logo ni couleurs d'une marque (entrée #002). Textes : nom, pseudo (« @… »), texte, aime, reponses, partages. -->
<div class="pm-bloc pm-bloc-publication pm-m-monte" data-start="0.5">
  <div class="pm-bloc-entete">
    <span class="pm-bloc-avatar"><svg class="pm-bloc-icone" data-icone="user-round"></svg></span>
    <p class="pm-bloc-ligne"><span class="pm-bloc-nom" data-texte="nom"></span><span class="pm-bloc-pseudo" data-texte="pseudo"></span></p>
  </div>
  <p class="pm-bloc-texte" data-texte="texte"></p>
  <p class="pm-bloc-compteurs">
    <span><svg class="pm-bloc-icone" data-icone="message-circle"></svg><span data-texte="reponses"></span></span>
    <span><svg class="pm-bloc-icone" data-icone="repeat-2"></svg><span data-texte="partages"></span></span>
    <span><svg class="pm-bloc-icone" data-icone="heart"></svg><span data-texte="aime"></span></span>
  </p>
</div>
