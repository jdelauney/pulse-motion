<!-- Bloc « carte-appli » : carte d'une application (icône par data-icone, nom, sous-titre, bouton), entrée #001. Textes : nom, sous-titre, bouton. -->
<div class="pm-bloc pm-bloc-carte-appli pm-m-pop" data-start="0.5">
  <span class="pm-bloc-pastille"><svg class="pm-bloc-icone" data-icone="layout-grid"></svg></span>
  <div class="pm-bloc-corps">
    <p class="pm-bloc-titre" data-texte="nom"></p>
    <p class="pm-bloc-texte" data-texte="sous-titre"></p>
  </div>
  <span class="pm-bloc-bouton" data-texte="bouton"></span>
</div>
