<!-- Bloc « dialogue » : boîte de dialogue redessinée (message et deux boutons), le bouton choisi enfoncé à son instant. Textes : message, annuler, ok. -->
<div class="pm-bloc pm-bloc-dialogue pm-m-zoom-entree" data-start="0.5">
  <p class="pm-bloc-texte" data-texte="message"></p>
  <p class="pm-bloc-boutons"><span class="pm-bloc-bouton pm-bloc-second" data-texte="annuler"></span><span class="pm-bloc-bouton pm-bloc-choisie" data-texte="ok" data-start="2"></span></p>
</div>
