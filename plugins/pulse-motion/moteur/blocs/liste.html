<!-- Bloc « liste » : liste déroulante redessinée (le navigateur dessine la sienne hors de la page), ouverte, l'option choisie mise en valeur à son instant. Textes : champ, option-1, option-2, option-3. -->
<div class="pm-bloc pm-bloc-liste pm-m-zoom-entree" data-start="0.5">
  <p class="pm-bloc-champ"><span data-texte="champ"></span><svg class="pm-bloc-icone" data-icone="chevron-down"></svg></p>
  <ul class="pm-bloc-options">
    <li data-texte="option-1"></li>
    <li class="pm-bloc-choisie" data-texte="option-2" data-start="1.6"></li>
    <li data-texte="option-3"></li>
  </ul>
</div>
