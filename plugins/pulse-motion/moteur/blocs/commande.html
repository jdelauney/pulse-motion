<!-- Bloc « commande » : commande dans une pastille sombre ; « Copier » devient « Copié » à l'instant de pm-bloc-copier. Texte : commande.
     Variante terminal : data-variante="terminal", une ligne d'invite par commande (data-lettres="saisie"), puis ses lignes de sortie à leur instant ; les anciennes lignes montent quand la fenêtre est pleine ; « Copier » facultatif. -->
<div class="pm-bloc pm-bloc-commande pm-m-pop" data-start="0.5">
  <code class="pm-bloc-code" data-texte="commande"></code>
  <span class="pm-bloc-copier" data-start="2.5"><svg class="pm-bloc-icone pm-bloc-avant" data-icone="copy"></svg><svg class="pm-bloc-icone pm-bloc-apres" data-icone="check"></svg></span>
</div>
