<!-- Bloc « toast » : message bref en bas de l'image, avec une coche (entrée #002). Texte : message. Alerte : data-variante="alerte" et data-icone="triangle-alert". -->
<div class="pm-bloc pm-bloc-toast pm-m-monte" data-start="2" style="--pm-ampleur: 3">
  <svg class="pm-bloc-icone" data-icone="circle-check"></svg>
  <p class="pm-bloc-texte" data-texte="message"></p>
</div>
