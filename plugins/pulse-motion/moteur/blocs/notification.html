<!-- Bloc « notification » : notification générique qui glisse du coin (entrée #003). Textes : appli, quand (« maintenant »), titre, texte. Icône : data-icone (pulse-motion icones chercher <mot>). Place : --pm-bloc-haut, --pm-bloc-droite. -->
<div class="pm-bloc pm-bloc-notification pm-m-glisse-droite" data-start="1" style="--pm-ampleur: 14">
  <span class="pm-bloc-pastille"><svg class="pm-bloc-icone" data-icone="bell"></svg></span>
  <div class="pm-bloc-corps">
    <p class="pm-bloc-ligne"><span class="pm-bloc-appli" data-texte="appli"></span><span class="pm-bloc-quand" data-texte="quand"></span></p>
    <p class="pm-bloc-titre" data-texte="titre"></p>
    <p class="pm-bloc-texte" data-texte="texte"></p>
  </div>
</div>
