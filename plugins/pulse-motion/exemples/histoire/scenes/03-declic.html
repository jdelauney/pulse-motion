<!-- Scène « declic » (scène toute faite « chiffre », style editorial) : le déclic, en un chiffre. Durée : 9 s. -->
<section data-scene="declic">
  <div class="decor">
    <span class="ligne" data-decor data-start="0" data-dur="9" data-tween="--l 0→1 sine-inout"></span>
  </div>
  <h2 id="titre" class="chapo fondu" data-texte="titre" data-start="0.2" data-dur="0.9"></h2>
  <p class="chiffre-geant masque" data-start="#titre:fin+0.1" data-dur="1.2"><span id="valeur" data-start="#titre:fin+0.1" data-dur="2.2" data-tween="nombre 0→300 expo-out">0</span><span class="unite" data-texte="unite"></span></p>
  <span id="filet" class="filet court" data-start="#valeur:fin" data-dur="1" data-son="ding" data-son-volume="0.6"></span>
  <p id="legende" class="texte fondu" data-texte="legende" data-start="#filet+0.3" data-dur="1"></p>
</section>
