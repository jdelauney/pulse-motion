<!-- Scène « morale » (conclusion, style editorial) : la morale de l'histoire. Durée : 8 s.
     Dernière scène de la vidéo : le décor s'arrête à 7 s, image stable pendant la dernière seconde. -->
<section data-scene="morale" class="centre">
  <div class="decor">
    <span class="ligne" data-decor data-start="0" data-dur="7" data-tween="--l 0→1 sine-inout"></span>
  </div>
  <h2 id="titre" class="titre masque" data-texte="titre" data-start="0.2" data-dur="1.1"></h2>
  <span id="filet" class="filet court" data-start="#titre:fin" data-dur="1"></span>
  <p id="sous" class="chapo fondu" data-texte="sous" data-start="#filet+0.3" data-dur="1" data-son="carillon" data-son-volume="0.7"></p>
</section>
