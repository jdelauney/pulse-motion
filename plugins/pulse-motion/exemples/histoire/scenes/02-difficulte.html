<!-- Scène « difficulte » (alerte, style editorial) : la difficulté qui bloque tout, entre deux filets. Durée : 10 s. -->
<section data-scene="difficulte">
  <div class="decor">
    <span class="ligne" data-decor data-start="0" data-dur="10" data-tween="--l 0→1 sine-inout"></span>
  </div>
  <div class="encadre">
    <span id="haut" class="filet accent" data-start="0.3" data-dur="1.2"></span>
    <h2 id="titre" class="titre-moyen accent masque" data-texte="titre" data-start="#haut+0.4" data-dur="1.2" data-son="blip" data-son-volume="0.6"></h2>
    <p id="texte" class="texte fondu" data-texte="texte" data-start="#titre:fin+0.5" data-dur="1.2" data-son="souffle" data-son-volume="0.5"></p>
    <span id="bas" class="filet accent" data-start="#texte" data-dur="1.2"></span>
  </div>
</section>
