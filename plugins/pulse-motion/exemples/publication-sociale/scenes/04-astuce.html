<!-- Scène « astuce » (style energique, scène toute faite « etape ») : l'astuce à essayer dès aujourd'hui. 6 s, format 9:16 (empilée par le style).
     Entrées calées sur les temps (120 bpm) : numéro en pastille, titre, puis texte. Textes : numero, titre, texte. -->
<section data-scene="astuce">
  <div class="decor">
    <span class="bandes" data-decor data-start="0" data-dur="6" data-tween="--x 0cqh→-30cqh linear"></span>
  </div>
  <div class="etape">
    <span id="numero" class="pastille claque" data-texte="numero" data-start="1t" data-dur="0.45" data-son="pop"></span>
    <div class="etape-texte">
      <h2 id="titre" class="cri-moyen tombe" data-texte="titre" data-start="2t" data-dur="0.7"></h2>
      <p id="texte" class="texte volet" data-texte="texte" data-start="4t" data-dur="0.45" data-son="whoosh" data-son-volume="0.6"></p>
    </div>
  </div>
</section>
