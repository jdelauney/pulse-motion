<!-- Scène « idees » (d'après la scène toute faite « liste », style energique) : les 3 astuces tombent une par une, calées sur les temps (120 bpm). Durée : 9 s. -->
<section data-scene="idees">
  <div class="decor">
    <span class="bandes" data-decor data-start="0" data-dur="9" data-tween="--x 0cqh→-42cqh linear"></span>
  </div>
  <h2 id="titre" class="cri-moyen claque" data-texte="titre" data-start="1t" data-dur="0.45"></h2>
  <ol class="pile">
    <li id="point1" class="tombe" data-texte="point1" data-start="3t" data-dur="0.7" data-son="pop"></li>
    <li id="point2" class="tombe" data-texte="point2" data-start="5t" data-dur="0.7" data-son="pop"></li>
    <li id="point3" class="tombe" data-texte="point3" data-start="7t" data-dur="0.7" data-son="pop"></li>
  </ol>
</section>
