<!-- Scène « preuve » (style minimal, scène toute faite « chiffre ») : le chiffre clé qui prouve la promesse. Durée : 6 s.
     Textes : titre, unite, legende. Valeur : compteur de 0 à 3. -->
<section data-scene="preuve">
  <div class="decor">
    <span class="repere"></span>
    <span class="marqueur" data-decor data-start="0" data-dur="6" data-tween="--x 0cqw→60cqw expo-inout"></span>
  </div>
  <h2 id="titre" class="index monte" data-texte="titre" data-start="0.2" data-dur="0.45"></h2>
  <p class="chiffre-geant revele" data-start="#titre:fin+0.1" data-dur="0.5"><span id="valeur" data-start="#titre:fin+0.1" data-dur="1.6" data-tween="nombre 0→3 expo-out" data-son="ding" data-son-volume="0.7">0</span><span class="unite" data-texte="unite"></span></p>
  <span id="regle" class="regle" data-start="#valeur:fin" data-dur="0.5"></span>
  <p id="legende" class="texte monte" data-texte="legende" data-start="#regle+0.2" data-dur="0.45"></p>
</section>
