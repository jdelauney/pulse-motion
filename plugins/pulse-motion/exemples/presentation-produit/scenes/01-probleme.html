<!-- Scène « probleme » (scène toute faite « alerte », style minimal) : le problème que vit la personne visée. Durée : 7 s.
     Textes : titre, texte. -->
<section data-scene="probleme">
  <div class="decor">
    <span class="repere"></span>
    <span class="marqueur" data-decor data-start="0" data-dur="7" data-tween="--x 0cqw→60cqw expo-inout"></span>
  </div>
  <div id="boite" class="vigilance revele" data-start="0.2" data-dur="0.5" data-son="blip" data-son-volume="0.6">
    <div class="vigilance-corps">
      <h2 id="titre" class="titre-moyen" data-texte="titre"></h2>
      <p id="texte" class="texte monte" data-texte="texte" data-start="#boite:fin+0.3" data-dur="0.45" data-son="pop" data-son-volume="0.5"></p>
    </div>
  </div>
</section>
