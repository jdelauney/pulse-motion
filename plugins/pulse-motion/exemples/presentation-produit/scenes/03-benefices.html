    <span class="repere"></span>
    <span class="marqueur" data-decor data-start="0" data-dur="11" data-tween="--x 0cqw→60cqw linear"></span>

    <li id="point2" class="monte" data-texte="point2" data-start="#point1:fin+1" data-dur="0.45" data-son="pop" data-son-volume="0.6"></li>
    <li id="point3" class="monte" data-texte="point3" data-start="#point2:fin+1" data-dur="0.45" data-son="pop" data-son-volume="0.6"></li>
