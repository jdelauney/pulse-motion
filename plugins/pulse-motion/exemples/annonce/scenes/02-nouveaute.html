<!-- Scène « nouveaute » (d'après la scène toute faite « titre », style energique) : la nouveauté annoncée. 6 s.

<section data-scene="nouveaute">
  <div class="decor">
    <span class="bandes" data-decor data-start="0" data-dur="6" data-tween="--x 0cqh→-28cqh linear"></span>
  </div>
  <p id="etiquette" class="bandeau volet" data-texte="etiquette" data-start="0.1" data-dur="0.45" data-son="whoosh"></p>
  <h1 id="titre" class="cri pm-m-masque" data-texte="titre" data-start="#etiquette:fin" data-dur="0.7"></h1>
  <p id="sous" class="texte claque" data-texte="sous" data-start="#titre:fin+0.1" data-dur="0.45" data-son="pop"></p>
</section>
