<!-- Scène « equipe » (style tech-sombre, d'après la scène toute faite « liste ») : l'équipe et ses forces, 3 lignes de journal, rythme posé. 12 s. -->
<section data-scene="equipe">
  <div class="decor">
    <span class="grille" data-decor data-start="0" data-dur="12" data-tween="--x 0cqh→-16cqh linear; --y 0cqh→-8cqh linear"></span>
  </div>
  <h2 id="titre" class="titre-moyen glisse" data-texte="titre" data-start="0.2" data-dur="0.6"></h2>
  <ol class="journal">
    <li id="point1" class="ecrit" data-texte="point1" data-start="#titre:fin+0.4" data-dur="1.3" data-son="pop" data-son-volume="0.6"></li>
    <li id="point2" class="ecrit" data-texte="point2" data-start="#point1:fin+0.9" data-dur="1.3" data-son="pop" data-son-volume="0.6"></li>
    <li id="point3" class="ecrit" data-texte="point3" data-start="#point2:fin+0.9" data-dur="1.1" data-son="pop" data-son-volume="0.6"></li>
  </ol>
</section>
