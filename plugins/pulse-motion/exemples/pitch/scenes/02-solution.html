<!-- Scène « solution » (tech-sombre, d'après la scène toute faite « titre ») : le nom du projet, comme une invite de commande. Durée : 8 s.
     Temps musicaux (tempo 120 : 1t = 0,5 s). Titre : mouvement #004 (zoom d'entrée). -->
<section data-scene="solution">
  <div class="decor">
    <span class="grille" data-decor data-start="0" data-dur="8" data-tween="--x 0cqh→-8cqh linear; --y 0cqh→-4cqh linear"></span>
    <span class="balayage" data-decor data-start="0" data-dur="8" data-tween="--y 0cqh→100cqh linear"></span>
  </div>
  <p id="etiquette" class="invite ecrit" data-texte="etiquette" data-start="1t" data-dur="0.8" data-son="clic" data-son-volume="0.6"></p>
  <h1 id="titre" class="titre pm-m-zoom-entree" data-texte="titre" data-start="3t" data-dur="0.6" data-son="whoosh" data-son-volume="0.6" style="--pm-dur: 0.6s; --pm-ampleur: 0.8; --pm-courbe: var(--ease-cubic-out)"></h1>
  <p id="sous" class="texte ecrit curseur" data-texte="sous" data-start="5t" data-dur="1.4"></p>
</section>
