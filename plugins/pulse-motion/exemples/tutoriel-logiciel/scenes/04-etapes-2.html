<!-- Étapes 3 et 4 (composée) : cliquer sur « Enregistrer » (projecteur sur le bouton, l'étape clé), puis confirmer
     dans la fenêtre « Enregistrer la facture ? » ; le message « Facture enregistrée » reste à l'écran jusqu'à la fin. 7 s. -->
<section data-scene="etapes-2">
  <style>
    @scope {
      /* Même grammaire que les étapes 1 et 2 : consigne à gauche (44 cqh), écran à droite (110 cqh), 5 cqh d'écart. */
      :scope > .plan {
        position: absolute; inset: 0; z-index: 1;
        display: grid; grid-template-columns: 44cqh auto; column-gap: 5cqh;
        justify-content: center; align-items: center;
      }
      .consignes { display: grid; align-items: center; }
      .consignes > * { grid-area: 1 / 1; }
      :scope #consigne3.pm-bloc-consigne, :scope #consigne4.pm-bloc-consigne {
        flex-direction: column; align-items: flex-start; gap: 2.6cqh; max-width: 44cqh;
      }
      :scope .consignes .pm-bloc-numero { width: 9.5cqh; height: 9.5cqh; font-size: 5.2cqh; }
      :scope .consignes .pm-bloc-texte { font-size: 4.8cqh; line-height: 1.22; text-wrap: balance; }
      /* La consigne 3 laisse la place : elle monte et s'efface, plus vite qu'elle n'est entrée. */
      @keyframes sort-haut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-4cqh); } }
      .sortie { animation: sort-haut 0.35s var(--ease-cubic-in) both; }
    }
  </style>

  <div class="decor">
    <span class="rond accent" data-decor style="width: 58cqh; height: 58cqh; left: -18cqh; bottom: -24cqh" data-start="0" data-dur="scene" data-tween="--dx 0cqh→5cqh sine-inout"></span>
    <span class="rond" data-decor style="width: 40cqh; height: 40cqh; right: -12cqh; top: -14cqh" data-start="0" data-dur="scene" data-tween="--dy 0cqh→6cqh sine-inout"></span>
  </div>

  <div class="plan">
    <div class="consignes">
      <div id="sortie3" class="sortie" data-start="3.3" data-dur="0.35">
        <div id="consigne3" class="pm-bloc pm-bloc-consigne pm-m-glisse-gauche" data-start="0.1" data-dur="0.6">
          <span class="pm-bloc-numero" data-texte="numero3"></span>
          <p class="pm-bloc-texte" data-texte="consigne3"></p>
        </div>
      </div>
      <div id="consigne4" class="pm-bloc pm-bloc-consigne pm-m-glisse-gauche" data-start="#sortie3+0.15" data-dur="0.6">
        <span class="pm-bloc-numero" data-texte="numero4"></span>
        <p class="pm-bloc-texte" data-texte="consigne4"></p>
      </div>
    </div>

    <div class="pm-ecran" data-cadre="navigateur" data-film="factures" data-etapes="3-4" data-film-camera="suivre" data-start="0" style="--pm-ecran-l: 110cqh">
      <!-- Étape 3, l'étape clé : le projecteur trouve le bouton avant le pointeur, puis s'efface quand la fenêtre s'ouvre ; recul au plan large pour la montrer entière. -->
      <i class="pm-projecteur" data-cible="etape:3" data-start="0.9" data-dur="1.6"></i>
      <i class="pm-zoom" data-cible="etape:3" data-start="1.7" data-dur="1.1" data-echelle="1.6"></i>
      <i class="pm-etape" data-etape="3" data-start="2"></i>
      <!-- Étape 4 : zoom court sur le bouton de la fenêtre, recul avant le message « Facture enregistrée ». -->
      <i class="pm-zoom" data-cible="etape:4" data-start="4.4" data-dur="1.1" data-echelle="1.6"></i>
      <i class="pm-etape" data-etape="4" data-start="4.7"></i>
    </div>
  </div>
</section>
