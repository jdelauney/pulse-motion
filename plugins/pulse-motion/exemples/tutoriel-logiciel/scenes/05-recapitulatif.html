<!-- Liste (scène toute faite) : récapituler les 4 étapes, une ligne chacune. 5 s, entrées resserrées. -->
<section data-scene="recapitulatif">
  <div class="decor">
    <span class="rond" data-decor style="width: 60cqh; height: 60cqh; right: -20cqh; top: -18cqh" data-start="0" data-dur="scene" data-tween="--dy 0cqh→10cqh sine-inout"></span>
  </div>
  <h2 id="titre" class="titre-moyen entre-gauche" data-texte="titre" data-start="0.1" data-dur="0.5"></h2>
  <ul class="liste">
    <li id="point1" class="entre-gauche" data-texte="point1" data-start="#titre:fin+0.3" data-dur="0.5"></li>
    <li id="point2" class="entre-gauche" data-texte="point2" data-start="#point1:fin+0.3" data-dur="0.5"></li>
    <li id="point3" class="entre-gauche" data-texte="point3" data-start="#point2:fin+0.3" data-dur="0.5"></li>
    <li id="point4" class="entre-gauche" data-texte="point4" data-start="#point3:fin+0.3" data-dur="0.5"></li>
  </ul>
</section>
