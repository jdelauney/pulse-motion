<section data-scene="reflexes">
  <div class="decor">
    <span class="rond" style="width: 50cqh; height: 50cqh; left: -15cqh; bottom: -20cqh" data-start="0" data-dur="13" data-tween="--dx 0cqh→10cqh sine-inout"></span>
  </div>
  <h2 id="titre" class="titre-moyen entre-bas" data-texte="titre" data-start="0.3" data-dur="0.7"></h2>
  <div class="rangee">
    <div id="gauche" class="colonne entre-gauche" data-start="#titre:fin+0.3" data-dur="0.7">
      <h3 class="colonne-titre" data-texte="gauche-titre"></h3>
      <p class="texte" data-texte="gauche-texte"></p>
    </div>
    <div id="droite" class="colonne accent entre-droite" data-start="#gauche:fin+1.5" data-dur="0.7">
      <h3 class="colonne-titre" data-texte="droite-titre"></h3>
      <p class="texte" data-texte="droite-texte"></p>
    </div>
  </div>
</section>
